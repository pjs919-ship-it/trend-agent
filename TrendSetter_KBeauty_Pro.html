<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K-Beauty TrendSetter Pro — B2B Edition v2</title>
<style>
:root {
  --purple: #6C2BD9;
  --purple-dark: #4C1D95;
  --purple-soft: #F3EEFD;
  --gold: #BF8A12;
  --gold-soft: #FFFDF5;
  --ink: #1C1730;
  --ink-secondary: #374151;
  --muted: #6B7280;
  --bg: #FAF9FE;
  --surface: #FFFFFF;
  --surface-subtle: #FBF9FF;
  --line: #ECE9F5;
  --line-strong: #D8D3E8;
  --go: #0F766E;
  --go-soft: #E6F6F4;
  --warn: #B45309;
  --warn-soft: #FEF3C7;
  --drop: #4B5563;
  --drop-soft: #F3F4F6;
  --danger: #B91C1C;
  --danger-soft: #FEF2F2;
  --hot: #C2410C;
  --hot-soft: #FFF7ED;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  line-height: 1.5;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 18px 64px; }
.tnum { font-variant-numeric: tabular-nums; }

/* Header */
.hero {
  display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px;
  padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 18px;
}
.hero h1 { font-size: 1.85rem; font-weight: 800; margin: 0; line-height: 1.25; color: var(--ink); }
.hero .sub { font-size: 0.9rem; color: var(--muted); margin-top: 4px; }

/* Control Panel */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 18px 20px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(28,23,48,0.05);
}
.panel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.field input, .field select {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 10px;
  font-size: 0.88rem; color: var(--ink); background: #FFF;
}
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.btn {
  padding: 10px 16px; border-radius: 10px; font-size: 0.88rem; font-weight: 700; cursor: pointer;
  border: 1px solid transparent; transition: all 0.15s ease;
}
.btn-primary { background: var(--purple); color: #FFF; }
.btn-primary:hover { background: var(--purple-dark); }
.btn-sec { background: var(--purple-soft); color: var(--purple-dark); border-color: #C4B5FD; }
.btn-sec:hover { background: #EDE9FE; }
.btn-outline { background: #FFF; color: var(--ink-secondary); border-color: var(--line-strong); }
.btn-outline:hover { background: var(--surface-subtle); }
.btn-danger { background: var(--danger-soft); color: var(--danger); border: 1.5px solid var(--danger); }
.status-bar { font-size: 0.84rem; color: var(--purple-dark); font-weight: 600; margin-top: 10px; min-height: 20px; }

/* Banners */
.alert-banner {
  padding: 11px 16px; border-radius: 10px; font-size: 0.86rem; font-weight: 600; margin-bottom: 12px;
}
.alert-warn { background: var(--warn-soft); color: var(--warn); border: 1px solid #F59E0B; border-left: 4px solid var(--warn); }
.alert-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid #FCA5A5; border-left: 4px solid var(--danger); }
.alert-info { background: var(--drop-soft); color: var(--drop); border: 1px solid #D1D5DB; }

/* KPI Strip */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.kpi-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; box-shadow: 0 1px 3px rgba(28,23,48,0.05);
}
.kpi-label { font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.kpi-val { font-size: 1.45rem; font-weight: 800; color: var(--ink); line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 0.78rem; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }

/* Pills & Badges */
.pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 0.76rem; font-weight: 700; }
.pill-go { background: var(--go-soft); color: var(--go); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-drop { background: var(--drop-soft); color: var(--drop); }
.pill-purple { background: var(--purple-soft); color: var(--purple); }
.pill-gold { background: #FEF3C7; color: #92400E; border: 1px solid #F59E0B; }
.pill-hot { background: var(--hot-soft); color: var(--hot); }
.badge-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* Market Patterns Box */
.insight-box {
  background: linear-gradient(135deg, #F6F2FF 0%, #FFFFFF 100%);
  border: 1px solid #E0D8F5; border-left: 5px solid var(--purple);
  border-radius: 14px; padding: 18px 22px; margin-bottom: 22px;
}
.insight-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.insight-title { font-size: 1.08rem; font-weight: 800; color: var(--purple-dark); margin: 0; }
.pattern-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; font-size: 0.92rem; color: var(--ink-secondary); }
.pattern-num {
  min-width: 22px; height: 22px; border-radius: 999px; background: var(--purple); color: #FFF;
  font-size: 0.76rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px;
}

/* Go Campaign Cards */
.sec-heading { font-size: 1.15rem; font-weight: 800; color: var(--ink); margin: 20px 0 12px; }
.tcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 20px 22px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(28,23,48,0.05);
}
.tcard.gold { border: 2px solid var(--gold); background: var(--gold-soft); }
.tcard-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.dots { font-size: 0.88rem; font-weight: 800; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.tcard-title { font-size: 1.12rem; font-weight: 800; color: var(--ink); margin: 6px 0 8px; }
.tcard-reason { font-size: 0.91rem; color: var(--ink-secondary); margin-bottom: 8px; }
.claim-chip {
  display: inline-block; background: var(--go-soft); color: var(--go); border-radius: 8px;
  padding: 4px 10px; font-size: 0.82rem; font-weight: 700; margin-bottom: 12px;
}
.quote-box {
  background: #F4FBF9; border-left: 3px solid var(--go); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px;
}
.quote-meta { display: flex; justify-content: space-between; font-size: 0.76rem; font-weight: 700; color: var(--go); margin-bottom: 4px; }
.quote-text { font-size: 0.9rem; font-weight: 600; color: var(--ink); }

.evid-item {
  display: flex; align-items: center; gap: 12px; background: var(--surface-subtle);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px;
}
.evid-thumb { width: 96px; height: 54px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #E5E7EB; }
.evid-body { flex: 1; min-width: 0; }
.evid-title { font-size: 0.88rem; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.evid-meta { font-size: 0.78rem; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.evid-link {
  padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line-strong);
  font-size: 0.78rem; font-weight: 700; color: var(--purple-dark); text-decoration: none; white-space: nowrap; background: #FFF;
}
.evid-link:hover { background: var(--purple-soft); }

.sb-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
.sb-cell { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.sb-label { font-size: 0.78rem; font-weight: 800; color: var(--purple-dark); margin-bottom: 5px; }
.sb-text { font-size: 0.88rem; color: var(--ink-secondary); }
.note-strip {
  background: #FFF8F8; border: 1px solid #FECACA; border-radius: 10px;
  padding: 9px 12px; font-size: 0.81rem; color: var(--ink-secondary); margin-bottom: 12px;
}
.action-bar { display: flex; gap: 10px; flex-wrap: wrap; }
.action-bar .btn { flex: 1; min-width: 220px; text-align: center; }

/* Pivot & Collapsible Details */
.pivot-card {
  display: flex; align-items: center; gap: 12px; background: var(--surface);
  border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 10px;
}
.pivot-thumb { width: 72px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #E5E7EB; }

details.b2b-details {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 16px; margin-top: 14px;
}
details.b2b-details summary {
  font-size: 0.94rem; font-weight: 800; color: var(--ink); cursor: pointer; list-style: none;
}
details.b2b-details summary::-webkit-details-marker { display: none; }
.sort-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.sort-btn {
  padding: 6px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 700;
  border: 1px solid var(--line-strong); background: #FFF; color: var(--muted); cursor: pointer;
}
.sort-btn.active { background: var(--purple); color: #FFF; border-color: var(--purple); }

.b2b-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; margin-top: 10px; }
.b2b-table th { background: var(--surface-subtle); color: var(--muted); font-weight: 700; text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
.b2b-table td { padding: 9px 8px; border-bottom: 1px solid var(--line); color: var(--ink-secondary); font-variant-numeric: tabular-nums; }
.b2b-table a { color: var(--purple-dark); font-weight: 600; text-decoration: none; }
.empty-box {
  border: 1px dashed var(--line-strong); border-radius: 14px; padding: 24px;
  text-align: center; color: var(--muted); background: #FFF; font-size: 0.92rem;
}

.toast {
  position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: #FFF;
  padding: 10px 16px; border-radius: 10px; font-size: 0.85rem; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 9999;
}
.toast.show { opacity: 1; }

@media (max-width: 768px) {
  .panel-grid { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .sb-grid { grid-template-columns: 1fr; }
  .evid-item { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1>💄 K-Beauty TrendSetter Pro</h1>

</div>
<div id="toast" class="toast">✅ 클립보드에 복사되었습니다!</div>

<script>
// products.json 단일 출처 확인 문구만 탑재 (미확인 7스킨·올리브영1위·2.5mm 완전 제거)
const PRODUCTS = {

      "그린 플라보노이드™ 성분, 외부 자극·트러블로 예민해진 피부 진정",
      "은은한 쿨링감과 수분, 끈적임 없는 마무리",
      "여드름성 피부 자극 테스트 완료",
      "얇고 부드러운 고밀착 패드, 5~10분 팩처럼 얹어 사용"
    ],
    banned: ["3중 레이어 거즈 패드", "붉은기 즉각 완화"],
    fit_territory: ["트러블 진정", "자극 후 진정", "열감/쿨링", "메이크업 전 진정 루틴"],
    non_fit_territory: ["색조 메이크업", "미백 광고성 표현", "각질 제거"]
  },
  "올리고 히알루론산 워터리 스킨 마스크": {
    confidence: "medium",
    verified_claims: [
      "저분자 올리고 히알루론산 1,000ppm",
      "대나무 유래 비건 시트",
      "자극 테스트 0.00(비자극) 판정",
      "메이크업 전 사용 / 1일 1팩 용도",
      "사용: 10~20분"
    ],
    banned: ["식물성 초밀착 시트", "열감 내리는 효과"],
    fit_territory: ["속당김", "메이크업 전 수분 루틴", "1일 1팩", "시트팩 루틴"],
    non_fit_territory: ["색조 메이크업 믹싱", "모공/피지 집중 케어"]
  }
};

const SKINCARE_ANCHORS = ["올리브영 스킨케어 추천", "피부 뒤집어졌을때", "화잘먹 기초 루틴"];
const COSMETIC_BANNED = [
  "1위","1등","최고","즉각","완벽","100%","기적","치료","재생","염증 완화",
  "여드름 완치","완치","아토피","피부염","피부과 시술","시술","모공 축소","주름 개선","미백","품절 대란","베스트셀러"
];
const NON_FIT_MAP = {
  "색조": ["색조","립틴트","틴트","블러셔","립스틱","섀도","아이라이너","속눈썹","쉐딩","컨실러","퍼스널컬러"],
  "블러셔": ["블러셔","틴트","믹싱"],
  "헤어": ["헤어","샴푸","트리트먼트","두피"],
  "바디": ["바디워시","바디로션"],
  "각질": ["각질 제거","각질제거","필링","스크럽","필링젤","aha","bha","pha"],
  "미백": ["미백","기미","잡티","화이트닝"],
  "모공": ["모공","블랙헤드","화이트헤드","클렌징오일"]
};

let currentResult = null;
let rawSortKey = "views_per_day";

function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function norm(s) {
  return String(s ?? "").replace(/\[[^\]]{1,15}\]|>>/g, " ").replace(/[\s\W_]+/g, "").toLowerCase();
}
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2000);
}
function copyText(txt, needsReview) {
  if (needsReview && !confirm("검수 필요 항목이 포함되어 있습니다. 내용을 확인 후 복사할까요?")) return;
  const done = () => showToast("✅ 클립보드에 복사되었습니다!");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else {
    fallbackCopy(txt, done);
  }
}
function fallbackCopy(txt, cb) {
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta); cb();
}
function dotGauge(score, decision) {
  const s = Math.max(1, Math.min(5, Number(score) || 1));
  const dots = "●".repeat(s) + "○".repeat(5 - s);
  const col = decision === "Go" ? (s === 5 ? "var(--gold)" : "var(--go)") : decision === "Pivot" ? "var(--warn)" : "var(--drop)";
  return `<span class="dots" style="color:${col};">${dots} ${s}점</span>`;
}
function isoToSec(dur) {
  const m = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(dur || "");
  if (!m) return 0;
  return (Number(m[1]||0)*3600) + (Number(m[2]||0)*60) + Number(m[3]||0);
}
function computeMetrics(v) {
  const views = Number(v.views || 0);
  const likes = Number(v.likes || 0);
  let days = Number(v.days_since_published || 0);
  if (!days && v.published_at) {
    const dt = new Date(v.published_at);
    const hrs = Math.max(0, (Date.now() - dt.getTime()) / 3600000);
    days = Math.max(0.25, Math.round((hrs / 24) * 100) / 100);
  }
  if (!days) days = 1;
  return {
    ...v,
    views, likes,
    days_since_published: days,
    views_per_day: Number(v.views_per_day || Math.round(views / days)),
    like_rate: v.like_rate != null ? Number(v.like_rate) : Math.round((likes / Math.max(1, views)) * 10000) / 100
  };
}
const NUM_TOKEN_RE = /\d[\d,.]*\s*(?:%|ppm|mm|ml|배속|배|스킨|겹|중|위|등|시간|초|분|일|만\s*개?|억|개)/g;
const DIRECTION_TIME_RE = /(?:첫|초반)\s*\d+\s*초(?!\s*만에)|\b\d+\s*초\s*(?:훅|이내|후|오프닝|클립|분량|연출|촬영)|\b(?:[3-9]|\d{2,})\s*초\s*컷/g;
const INTERNAL_PAREN_RE = /\s*\([^)]*(?:요약|blancdoux|kurly|glowpick|costco|hwahae|gsshop|koreadepart|미확인)[^)]*\)/gi;

function cleanClaim(s) {
  if (!s || String(s).includes("시험 조건은 미확인")) return "";
  return String(s)
    .replace(INTERNAL_PAREN_RE, "")
    .replace(/케어를\s*내세움$/, "케어")
    .replace(/를\s*내세움$/, "")
    .replace(/(?:으)?로\s*소개$/, "")
    .trim();
}
function checkBriefViolations(b, prod) {
  const text = `${b.hook || ""} ${b.before || ""} ${b.product_moment || ""} ${b.cta || ""}`;
  const nt = norm(text);
  const claimsStr = (prod.verified_claims || []).join(" ");
  const nc = norm(claimsStr);
  const v = [];
  for (const bad of (prod.banned || [])) {
    if (norm(bad) && nt.includes(norm(bad))) v.push(`확인되지 않은 문구: ${bad}`);
  }
  for (const term of COSMETIC_BANNED) {
    if (norm(term) && nt.includes(norm(term)) && !nc.includes(norm(term))) v.push(`과대광고 의심: ${term}`);
  }
  const scanText = text.replace(DIRECTION_TIME_RE, " ");
  const toks = scanText.match(NUM_TOKEN_RE) || [];
  for (const tok of toks) {
    if (!nc.includes(norm(tok))) v.push(`출처 없는 수치 표현: ${tok.trim()}`);
  }
  return [...new Set(v)];
}
function buildCopyables(res) {
  const prod = PRODUCTS[res.product] || { verified_claims: [], banned: [] };
  const vBy = Object.fromEntries((res.videos || []).map(v => [v.video_id, computeMetrics(v)]));
  const fBy = Object.fromEntries((res.facts || []).map(f => [f.video_id, f]));
  const bBy = Object.fromEntries((res.briefs || []).map(b => [b.video_id, b]));
  const go = (res.judgements || []).filter(j => j.decision === "Go");
  const pv = (res.judgements || []).filter(j => j.decision === "Pivot");
  const dr = (res.judgements || []).filter(j => j.decision === "Drop");
  const rep = [
    `# [주간 K-뷰티 쇼츠 트렌드 보고] ${res.product}`,
    `- 보고 기준일: ${res.report_date} | 최근 ${res.days_range || 30}일 | Go ${go.length} · Pivot ${pv.length} · Drop ${dr.length}`,
    "", "## 1. 이번 주 시장 바이럴 패턴",
    ...(res.market_patterns || []).map((p, i) => `${i+1}. ${p}`),
    "", "## 2. Go 추천 컨셉",
    ...go.map((j, i) => {
      const v = vBy[j.video_id] || {}, f = fBy[j.video_id] || {}, b = bBy[j.video_id];
      const warnLine = (b && b.needs_review) ? `> 🚨 [발송 보류 — 검수 필요]: ${(b.violations||[]).join("; ")}\n` : "";
      return `### Go #${i+1}. ${v.title || j.video_id}\n${warnLine}- https://youtube.com/shorts/${j.video_id} | 조회수 ${(v.views||0).toLocaleString()}회 · 일평균 ${(v.views_per_day||0).toLocaleString()}회/일 | 포맷: ${f.format_tag || "기타"}\n- 근거(${j.score}점): ${j.reason}\n- 인용: "${f.hook_quote || f.evidence_quote || "-"}"`;
    }),
    "", `## 3. Drop 제외 요약 (${dr.length}건)`,
    ...dr.map(j => `- [${(fBy[j.video_id]||{}).domain || "-"}] ${(vBy[j.video_id]||{}).title || j.video_id}: ${j.reason}`)
  ].join("\n");

  const flagged = (res.briefs || []).filter(b => b.needs_review);
  const dmWarn = flagged.length
    ? [`> 🚨 [발송 보류 — 검수 필요]: ${flagged.map(b => `${b.video_id}(${(b.violations||[]).join(", ")})`).join(" / ")}`, ""]
    : [];
  const dm = [
    ...dmWarn,
    `# [크리에이터 촬영 가이드] ${res.product}`,
    `- 배포 기준일: ${res.report_date} | 권장 규격: 세로형 9:16 숏폼 (20~45초) | 필수 표기: #광고 또는 #협찬`,
    "> 아래 가이드는 최근 실제 바이럴 쇼츠 포맷과 공식 확인된 제품 정보만을 기반으로 작성되었습니다.", "",
    ...(res.briefs || []).map((b, i) => {
      const v = vBy[b.video_id] || {}, f = fBy[b.video_id] || {};
      return [
        `## 컨셉 #${i+1}. [${f.format_tag || "기타"}] ${v.title || b.video_id}`,
        `- 참고 레퍼런스: https://youtube.com/shorts/${b.video_id}`,
        `- 첫 3초 훅: ${b.hook}`,
        `- 비포 상황: ${b.before}`,
        `- 제품 침투 시점: ${b.product_moment}`,
        `- CTA: ${b.cta}`,
        `- 촬영 주의사항: ${b.creator_note}`,
        prod.banned?.length ? `- 절대 사용 금지 문구: ${prod.banned.join(", ")}` : ""
      ].filter(Boolean).join("\n");
    }),
    "", "### [참고] 공식 확인된 제품 소구 포인트",
    ...(prod.verified_claims || []).map(cleanClaim).filter(Boolean).map(c => `- ${c}`)
  ].join("\n");

  return { internal_report_md: rep, creator_dm_clean_md: dm };
}

async function callGeminiJson(apiKey, model, prompt) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const resp = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.2, responseMimeType: "application/json" }
    })
  });
  if (!resp.ok) throw new Error(`Gemini API 오류 (${resp.status})`);
  const data = await resp.json();
  const txt = data?.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
  return JSON.parse(txt);
}

async function runLive2Stage() {
  const ytKey = document.getElementById("ytKey").value.trim();
  const ggKey = document.getElementById("ggKey").value.trim();
  const productName = document.getElementById("productSel").value;
  const days = Number(document.getElementById("daysSel").value);
  const sortBy = document.getElementById("sortSel").value;
  const model = document.getElementById("modelSel").value;
  const status = document.getElementById("statusBar");

  if (!ytKey || !ggKey) { status.textContent = "⚠️ YouTube API Key와 Gemini API Key를 모두 입력하세요."; return; }
  const prod = PRODUCTS[productName];
  try {
    status.textContent = "1/3. YouTube 기초 스킨케어 쇼츠 수집 중...";
    const pubAfter = new Date(Date.now() - days * 86400000).toISOString();
    const idSet = new Set();
    for (const kw of SKINCARE_ANCHORS) {
      const u = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(kw + " shorts")}&type=video&videoCategoryId=26&videoDuration=short&order=viewCount&regionCode=KR&relevanceLanguage=ko&maxResults=10&publishedAfter=${encodeURIComponent(pubAfter)}&key=${encodeURIComponent(ytKey)}`;
      const r = await fetch(u);
      const d = await r.json();
      (d.items || []).forEach(it => it?.id?.videoId && idSet.add(it.id.videoId));
    }
    const ids = [...idSet].slice(0, 40);
    if (!ids.length) { status.textContent = "수집된 영상이 없습니다."; return; }

    const detUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,statistics&id=${ids.join(",")}&key=${encodeURIComponent(ytKey)}`;
    const det = await (await fetch(detUrl)).json();
    let videos = (det.items || []).map(it => {
      const secs = isoToSec(it.contentDetails?.duration);
      if (secs === 0 || secs > 120) return null;
      const sn = it.snippet || {}, st = it.statistics || {};
      return computeMetrics({
        video_id: it.id, title: sn.title || "", description: (sn.description || "").slice(0, 300),
        channel_title: sn.channelTitle || "", views: Number(st.viewCount || 0), likes: Number(st.likeCount || 0),
        published_at: sn.publishedAt || "", thumbnail_url: sn.thumbnails?.medium?.url || "",
        text_source: "meta", source_text: `${sn.title || ""} ${(sn.description || "").slice(0, 300)}`
      });
    }).filter(Boolean);
    videos.sort((a, b) => sortBy === "views" ? b.views - a.views : (b.views_per_day*0.6 + b.views*0.4) - (a.views_per_day*0.6 + a.views*0.4));
    videos = videos.slice(0, 10);

    // Stage 1: 브랜드 정보 완전 차단 팩트 + 포맷 + 패턴 추출
    status.textContent = "2/3. [Stage 1] 브랜드 편향 차단 팩트·포맷·시장 패턴 추출 중...";
    const s1Prompt = `당신은 브랜드를 모르는 K-뷰티 리서처입니다. 아래 쇼츠의 제목·설명만으로 JSON을 반환하세요.
스키마: {"market_patterns":["패턴1","패턴2"],"facts":[{"video_id":"","domain":"기초/스킨케어|색조/메이크업|헤어/바디|기타/뷰티무관","format_tag":"비포/애프터 실험형|올영 추천 리스트형|응급처치 루틴형|믹싱 꿀팁형|겟레디윗미|제품 리뷰형|기타","what_happens":"","product_types":[],"hook_quote":"","evidence_quote":""}]}
규칙: 원문 복사 필수. 추측 금지.\n` + videos.map(v => `[${v.video_id}] ${v.title} | ${v.description}`).join("\n");
    const s1 = await callGeminiJson(ggKey, model, s1Prompt);
    const vBy = Object.fromEntries(videos.map(v => [v.video_id, v]));
    const facts = (s1.facts || []).filter(f => vBy[f.video_id]).map(f => {
      const src = norm(vBy[f.video_id].source_text);
      const evOk = norm(f.evidence_quote).length >= 4 && src.includes(norm(f.evidence_quote));
      return { ...f, evidence_ok: evOk, text_source: vBy[f.video_id].text_source };
    });

    // Stage 2: 제품 확인 문구 기반 Go/Pivot/Drop + Go만 4단 콘티
    status.textContent = "3/3. [Stage 2] 제품 매칭 판정 및 코드 가드레일 검증 중...";
    const s2Prompt = `당신은 '${productName}' 인하우스 마케터입니다. 아래 확인 문구만 근거로 판정하고 Go에만 4단 콘티를 작성하세요.
[확인 문구] ${prod.verified_claims.join(" / ")}
[적합 영역] ${prod.fit_territory.join(", ")}
[부적합 영역] ${prod.non_fit_territory.join(", ")}
[금지 표현] ${prod.banned.join(", ")}
JSON 스키마: {"judgements":[{"video_id":"","decision":"Go|Pivot|Drop","score":1,"reason":"","linked_claim":""}],"briefs":[{"video_id":"","hook":"","before":"","product_moment":"","cta":"","creator_note":""}]}
[시장 팩트]\n` + facts.map(f => `[${f.video_id}] 영역=${f.domain} | 포맷=${f.format_tag} | 내용=${f.what_happens}`).join("\n");
    const s2 = await callGeminiJson(ggKey, model, s2Prompt);

    // 코드 가드레일 강제 적용 (근거 실패·영역 불일치·non_fit 강제 Drop + linked_claim 8자)
    const fBy = Object.fromEntries(facts.map(f => [f.video_id, f]));
    const jByRaw = Object.fromEntries((s2.judgements || []).map(j => [j.video_id, j]));
    const judgements = facts.map(f => {
      if (!f.evidence_ok) {
        return { video_id: f.video_id, decision: "Drop", score: 1, reason: "[자동 제외] 근거 인용 검증 실패로 제외", linked_claim: "" };
      }
      const j = jByRaw[f.video_id] || { video_id: f.video_id, score: 1, reason: "[자동 제외] 판정 누락", linked_claim: "" };
      let score = Math.max(1, Math.min(5, Number(j.score) || 1));
      let reason = j.reason || "";
      if (f.domain !== "기초/스킨케어") { score = Math.min(score, 1); reason = `[규칙] 영역 불일치(${f.domain}). ` + reason; }
      const blob = norm(`${f.what_happens} ${(f.product_types||[]).join(" ")}`);
      for (const terr of prod.non_fit_territory) {
        for (const [k, kws] of Object.entries(NON_FIT_MAP)) {
          if (terr.includes(k) && kws.some(kw => blob.includes(norm(kw)))) { score = Math.min(score, 2); reason = `[규칙] 부적합 영역(${terr}). ` + reason; }
        }
      }
      if (score >= 4 && norm(j.linked_claim).length < 8) score = 3;
      const decision = score >= 4 ? "Go" : score === 3 ? "Pivot" : "Drop";
      return { ...j, video_id: f.video_id, score, decision, reason };
    });
    const goIds = new Set(judgements.filter(j => j.decision === "Go").map(j => j.video_id));
    const briefs = (s2.briefs || []).filter(b => goIds.has(b.video_id)).map(b => {
      const violations = checkBriefViolations(b, prod);
      return { ...b, violations, needs_review: violations.length > 0 };
    });

    const result = {
      product: productName, report_date: new Date().toISOString().slice(0, 10), days_range: days,
      product_confidence: prod.confidence, videos, facts, market_patterns: (s1.market_patterns || []).slice(0, 3),
      judgements, briefs, _mode: "live"
    };
    Object.assign(result, buildCopyables(result));
    renderDashboard(result);
    status.textContent = "✅ 2-Stage 실시간 분석 완료!";
  } catch (e) {
    status.textContent = "❌ 오류: " + e.message;
  }
}

function loadLocalJson(ev) {
  const file = ev.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      data._mode = "json_loaded";
      if (!data.internal_report_md || !data.creator_dm_clean_md) Object.assign(data, buildCopyables(data));
      renderDashboard(data);
      document.getElementById("statusBar").textContent = `✅ 로컬 JSON 로드 완료 (${file.name})`;
    } catch (e) {
      document.getElementById("statusBar").textContent = "❌ JSON 파싱 실패: " + e.message;
    }
  };
  reader.readAsText(file, "utf-8");
}

      { video_id:"brKNpouibqo", decision:"Go", score:5, reason:"실제 자막 기반 수분 케어 포맷이 제품의 확인된 소구 포인트와 직접 연결됨.", linked_claim:prod.verified_claims[0] },
      { video_id:"Zl5CPQxmWFE", decision:"Go", score:4, reason:"전성분 함량 공개 포맷이 확인된 성분 문구와 자연스럽게 연결됨.", linked_claim:prod.verified_claims[1] || prod.verified_claims[0] },
      { video_id:"RdXhzcCVtsw", decision:"Pivot", score:3, reason:"기초 시장 연관성은 있으나 자막 미확인(meta) 상태로 직접 시청 후 검토 필요.", linked_claim:prod.verified_claims[0] },
      { video_id:"jfsweQpxqsY", decision:"Drop", score:1, reason:"[규칙] 영상 영역이 '색조/메이크업'으로 제품 영역(기초/스킨케어)과 다름.", linked_claim:"" }
    ],
    briefs: [
      { video_id:"brKNpouibqo", hook:"첫 3초: 화장솜에 제품을 듬뿍 적시는 클로즈업과 '속건조로 화장 뜨는 아침' 자막", before:"세안 직후 당김과 베이스 들뜸이 느껴지는 비포 컷", product_moment:`${productName} — ${prod.verified_claims[0]} 중심으로 자연스럽게 시연`, cta:"올리브영/프로필 링크에서 데일리 루틴 확인하기", creator_note:"확인되지 않은 순위·즉각 효과 표현 금지", violations:[], needs_review:false },
      { video_id:"Zl5CPQxmWFE", hook:"첫 3초: 전성분 라벨을 확대하며 '성분표 직접 확인해봤습니다' 대사", before:"성분 확인 없이 수분 제품을 고르던 소비자의 고민 공감", product_moment:`${productName}의 확인된 특징(${prod.verified_claims[1] || prod.verified_claims[0]})을 팩트 중심으로 소개`, cta:"전성분 확인 후 댓글로 피부 타입 공유하기", creator_note:"과대광고 및 미확인 수치 표현 금지", violations:[], needs_review:false }
    ]
  };
  Object.assign(sample, buildCopyables(sample));
  renderDashboard(sample);
  document.getElementById("statusBar").textContent = "🧪 샘플 리허설 데이터를 로드했습니다 (API 쿼터 0).";
}

function setRawSort(key) {
  rawSortKey = key;
  if (currentResult) renderDashboard(currentResult, { openRaw: true });
}

function renderDashboard(res, opts = {}) {
  currentResult = res;
  const videos = (res.videos || []).map(computeMetrics);
  const facts = res.facts || [];
  const judgements = res.judgements || [];
  const briefs = res.briefs || [];
  const vBy = Object.fromEntries(videos.map(v => [v.video_id, v]));
  const fBy = Object.fromEntries(facts.map(f => [f.video_id, f]));
  const bBy = Object.fromEntries(briefs.map(b => [b.video_id, b]));
  const jBy = Object.fromEntries(judgements.map(j => [j.video_id, j]));
  const prod = PRODUCTS[res.product] || { banned: [] };

  const badge = document.getElementById("modeBadge");
  badge.textContent = res._mode === "live" ? "🟢 LIVE 분석 결과" : res._mode === "json_loaded" ? "📂 JSON 로드 뷰어" : "🧪 샘플 리허설 (쿼터 0)";
  badge.className = res._mode === "live" ? "pill pill-go" : "pill pill-warn";

  const totalV = videos.length;
  const capV = videos.filter(v => v.text_source === "caption").length;
  const capPct = totalV ? Math.round((capV / totalV) * 1000) / 10 : 0;
  const avgViews = totalV ? Math.round(videos.reduce((s, v) => s + v.views, 0) / totalV) : 0;
  const avgLr = totalV ? (videos.reduce((s, v) => s + v.like_rate, 0) / totalV).toFixed(2) : "0.00";
  const maxVpd = videos.reduce((m, v) => Math.max(m, v.views_per_day), 0);

  const goItems = judgements.filter(j => j.decision === "Go").sort((a,b) => (b.score - a.score) || ((vBy[b.video_id]?.views_per_day||0) - (vBy[a.video_id]?.views_per_day||0)));
  const pivotItems = judgements.filter(j => j.decision === "Pivot");
  const dropItems = judgements.filter(j => j.decision === "Drop");

  const confBanner = res.product_confidence && res.product_confidence !== "high"
    ? `<div class="alert-banner alert-warn">⚠️ <b>[제품 정보 확인 필요]</b> 현재 제품 문구는 요약 기반(신뢰도: ${esc(res.product_confidence)})입니다. 최종 광고·시딩 집행 전 공식 상세페이지 원문 및 임상 시험 조건을 반드시 확인하세요.</div>` : "";
  const lowViewsBanner = videos.some(v => v.low_views_fallback)
    ? `<div class="alert-banner alert-info">ℹ️ 저유입 기준 완화 포함: 최소 조회수 기준을 넘는 영상이 부족해 일부 저유입 영상이 포함되었습니다.</div>` : "";

  const patternsHtml = (res.market_patterns || []).map((p, i) =>
    `<div class="pattern-row"><span class="pattern-num">${i+1}</span><div>${esc(p)}</div></div>`
  ).join("") || `<div class="pattern-row">추출된 공통 시장 패턴이 없습니다.</div>`;

  const anyNeedsRev = briefs.some(b => b.needs_review);
  const goHtml = !goItems.length
    ? `<div class="empty-box">이번 수집 배치에서는 우리 제품과 억지 연결 없이 바로 집행할 Go 컨셉이 없습니다.<br>아래 Pivot 후보를 직접 시청해 검토하거나 수집 기간을 조정해 보세요.</div>`
    : goItems.map((j, idx) => {
        const v = vBy[j.video_id] || {}, f = fBy[j.video_id] || {}, b = bBy[j.video_id];
        const isTop = idx === 0;
        const thumb = v.thumbnail_url || `https://i.ytimg.com/vi/${esc(j.video_id)}/mqdefault.jpg`;
        const capBadge = f.text_source === "caption"
          ? `<span class="pill pill-go">✅ 자막 검증 완료</span>`
          : `<span class="pill pill-warn">⚠️ 자막 미확인 (직접 시청 필요)</span>`;
        const revBanner = (b && b.needs_review)
          ? `<div class="alert-banner alert-danger">🚨 <b>발송 보류 — 검수 필요:</b> ${esc((b.violations||[]).join("; "))}</div>` : "";
        const sbHtml = b ? `
          <div class="sb-grid">
            <div class="sb-cell"><div class="sb-label">⚡ 1. 첫 3초 훅</div><div class="sb-text">${esc(b.hook)}</div></div>
            <div class="sb-cell"><div class="sb-label">👀 2. 비포 공감 상황</div><div class="sb-text">${esc(b.before)}</div></div>
            <div class="sb-cell"><div class="sb-label">💧 3. 제품 침투 시점</div><div class="sb-text">${esc(b.product_moment)}</div></div>
            <div class="sb-cell"><div class="sb-label">🛒 4. 구매/참여 CTA</div><div class="sb-text">${esc(b.cta)}</div></div>
          </div>
          <div class="note-strip">
            <b>📝 크리에이터 주의사항:</b> ${esc(b.creator_note)}
            ${prod.banned?.length ? `<br><b>🚫 절대 금지 표현:</b> ${esc(prod.banned.join(", "))}` : ""}
          </div>` : "";
        return `
          <div class="tcard ${isTop ? "gold" : ""}">
            <div class="tcard-top">
              <div class="badge-group">
                ${isTop ? `<span class="pill pill-gold">👑 TOP GO PICK</span>` : ""}
                <span class="pill pill-go">🎯 Go</span>
                <span class="pill pill-purple">${esc(f.format_tag || "기타")}</span>
                ${capBadge}
              </div>
              <div>${dotGauge(j.score, "Go")}</div>
            </div>
            ${revBanner}
            <div class="tcard-title">${esc(f.what_happens || v.title || j.video_id)}</div>
            <div class="tcard-reason"><b>📌 Go 근거:</b> ${esc(j.reason)}</div>
            <div class="claim-chip">🔗 ${esc(cleanClaim(j.linked_claim) || j.linked_claim || "-")}</div>
            <div class="quote-box">
              <div class="quote-meta">
                <span>💬 실제 영상 원문 인용</span>
                <span>${f.text_source === "caption" ? "✅ 자막 100% 원문 대조 통과" : "⚠️ 제목·설명 기반 (브라우저 단독 실행 시 자막 미수집 — 직접 시청 권장)"}</span>
              </div>
              <div class="quote-text">"${esc(f.hook_quote || f.evidence_quote || "-")}"</div>
            </div>
            <div class="evid-item">
              <img class="evid-thumb" src="${esc(thumb)}" alt="thumb" />
              <div class="evid-body">
                <div class="evid-title">${esc(v.title || j.video_id)}</div>
                <div class="evid-meta">
                  <span>📺 ${esc(v.channel_title || "-")}</span>
                  <span>👀 ${(v.views||0).toLocaleString()}회</span>
                  <span class="pill pill-hot">🔥 ${(v.views_per_day||0).toLocaleString()}회/일</span>
                  <span>❤️ ${(v.like_rate||0).toFixed(2)}%</span>
                  <span>📅 ${esc((v.published_at||"-").slice(0,10))}</span>
                </div>
              </div>
              <a class="evid-link" href="https://youtube.com/shorts/${esc(j.video_id)}" target="_blank" rel="noopener">쇼츠 보기 ↗</a>
            </div>
            ${sbHtml}
          </div>`;
      }).join("") + `
      <div class="action-bar" style="margin-bottom:18px;">
        <button class="btn btn-sec" onclick="copyText(currentResult.internal_report_md, false)">📋 팀장/슬랙 보고 복사</button>
        <button class="btn ${anyNeedsRev ? "btn-danger" : "btn-primary"}" onclick="copyText(currentResult.creator_dm_clean_md || currentResult.creator_guide_md, ${anyNeedsRev})">
          ${anyNeedsRev ? "⚠️ 검수 후 DM 복사" : "💌 인플루언서 DM 복사 (깨끗한 본문)"}
        </button>
      </div>`;

  const pivotHtml = pivotItems.length ? `
    <div class="sec-heading">⚠️ Pivot — 서브 테스트 / 직접 시청 검토 (${pivotItems.length}건)</div>
    ${pivotItems.map(j => {
      const v = vBy[j.video_id] || {}, f = fBy[j.video_id] || {};
      const thumb = v.thumbnail_url || `https://i.ytimg.com/vi/${esc(j.video_id)}/mqdefault.jpg`;
      const metaBadge = f.text_source !== "caption"
        ? `<span class="pill pill-warn">⚠️ 자막 미확인 (직접 시청 필요)</span>`
        : `<span class="pill pill-go">✅ 자막 검증 완료</span>`;
      return `
        <div class="pivot-card">
          <img class="pivot-thumb" src="${esc(thumb)}" alt="thumb" />
          <div class="evid-body">
            <div class="badge-group" style="margin-bottom:4px;">
              ${metaBadge}
              <span class="pill pill-purple">${esc(f.format_tag || "기타")}</span>
              ${dotGauge(j.score, "Pivot")}
            </div>
            <div class="evid-title"><a href="https://youtube.com/shorts/${esc(j.video_id)}" target="_blank" rel="noopener" style="color:var(--ink);text-decoration:none;">${esc(v.title || j.video_id)} ↗</a></div>
            <div class="evid-meta">
              <span>👀 ${(v.views||0).toLocaleString()}회</span>
              <span class="pill pill-hot">🔥 ${(v.views_per_day||0).toLocaleString()}회/일</span>
              <span>사유: ${esc(j.reason)}</span>
            </div>
          </div>
        </div>`;
    }).join("")}` : "";

  const dropRows = dropItems.map(j => {
    const v = vBy[j.video_id] || {}, f = fBy[j.video_id] || {};
    const evBadge = f.evidence_ok === false ? ` <span class="pill pill-drop">🚫 근거 검증 실패</span>` : "";
    return `<tr>
      <td><span class="pill pill-drop">${esc(f.domain || "-")}</span>${evBadge}</td>
      <td><a href="https://youtube.com/shorts/${esc(j.video_id)}" target="_blank" rel="noopener">${esc((v.title||j.video_id).slice(0,55))} ↗</a></td>
      <td>${(v.views||0).toLocaleString()}회</td>
      <td>${esc(j.reason)}</td>
    </tr>`;
  }).join("");

  const sortedRaw = [...videos].sort((a,b) => (b[rawSortKey]||0) - (a[rawSortKey]||0));
  const rawRows = sortedRaw.map((v, i) => {
    const f = fBy[v.video_id] || {}, j = jBy[v.video_id] || {};
    const dec = j.decision || "-";
    const dCls = dec === "Go" ? "pill-go" : dec === "Pivot" ? "pill-warn" : "pill-drop";
    return `<tr>
      <td><b>${i+1}</b></td>
      <td><a href="https://youtube.com/shorts/${esc(v.video_id)}" target="_blank" rel="noopener">${esc((v.title||v.video_id).slice(0,45))} ↗</a></td>
      <td>${esc(v.channel_title || "-")}</td>
      <td>${v.views.toLocaleString()}</td>
      <td><b>🔥 ${v.views_per_day.toLocaleString()}</b></td>
      <td>${v.like_rate.toFixed(2)}%</td>
      <td>${esc((v.published_at||"-").slice(0,10))}</td>
      <td>${v.text_source === "caption" ? "✅" : "⚠️"}</td>
      <td><span class="pill pill-purple">${esc(f.format_tag || "기타")}</span></td>
      <td><span class="pill ${dCls}">${esc(dec)}</span></td>
    </tr>`;
  }).join("");

  document.getElementById("dashboard").innerHTML = `
    ${confBanner}
    ${lowViewsBanner}
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">🎬 클리핑 쇼츠</div>
        <div class="kpi-val">${totalV}건</div>
        <div class="kpi-sub">자막 확보 ${capV}건 (${capPct}%)</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">👀 평균 조회수</div>
        <div class="kpi-val">${avgViews.toLocaleString()}회</div>
        <div class="kpi-sub">평균 좋아요율 ${avgLr}%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">🔥 최고 상승속도</div>
        <div class="kpi-val">${maxVpd.toLocaleString()}회/일</div>
        <div class="kpi-sub">최근 ${Number(res.days_range||30)}일 급상승 1위</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">📊 판정 분포 (합계 ${goItems.length+pivotItems.length+dropItems.length}건)</div>
        <div class="badge-group" style="margin-top:2px;">
          <span class="pill pill-go">🎯 Go ${goItems.length}</span>
          <span class="pill pill-warn">⚠️ Pivot ${pivotItems.length}</span>
          <span class="pill pill-drop">❌ Drop ${dropItems.length}</span>
        </div>
        <div class="kpi-sub">억지 연결 차단 (${dropItems.length}건 필터)</div>
      </div>
    </div>

    <div class="insight-box">
      <div class="insight-head">
        <div class="insight-title">🧭 이번 주 K-뷰티 시장 관통 패턴</div>
        <span class="pill pill-purple">브랜드 편향 0% · Stage 1 객관 추출</span>
      </div>
      ${patternsHtml}
    </div>

    <div class="sec-heading">🎯 Go 판정 캠페인 컨셉 (${goItems.length}건)</div>
    ${goHtml}
    ${pivotHtml}

    <details class="b2b-details">
      <summary>▶ ❌ 부적합 탈락 ${dropItems.length}건 — 억지 연결 차단 내역 보기 (기본 접힘)</summary>
      ${dropItems.length ? `<table class="b2b-table"><thead><tr><th>도메인</th><th>영상 제목 (쇼츠 링크)</th><th>조회수</th><th>탈락 사유</th></tr></thead><tbody>${dropRows}</tbody></table>` : `<div style="margin-top:10px;color:var(--muted);">탈락 항목이 없습니다.</div>`}
    </details>

    <details id="rawDetails" class="b2b-details" ${opts.openRaw ? "open" : ""}>
      <summary>▶ 📊 클리핑 원본 Top ${totalV} 전체 보기 (정렬 가능)</summary>
      <div class="sort-bar">
        <button class="sort-btn ${rawSortKey==='views_per_day'?'active':''}" onclick="setRawSort('views_per_day')">🔥 일평균 조회수순</button>
        <button class="sort-btn ${rawSortKey==='views'?'active':''}" onclick="setRawSort('views')">👀 총 조회수순</button>
        <button class="sort-btn ${rawSortKey==='like_rate'?'active':''}" onclick="setRawSort('like_rate')">❤️ 좋아요율순</button>
      </div>
      <table class="b2b-table">
        <thead><tr><th>#</th><th>영상</th><th>채널</th><th>총조회수</th><th>일평균🔥</th><th>좋아요율</th><th>업로드일</th><th>자막</th><th>포맷</th><th>판정</th></tr></thead>
        <tbody>${rawRows}</tbody>
      </table>
    </details>
  `;
}

// Init product dropdown & load sample rehearsal
const sel = document.getElementById("productSel");
Object.keys(PRODUCTS).forEach(name => {
  const opt = document.createElement("option");
  opt.value = name; opt.textContent = name;
  sel.appendChild(opt);
});
loadSampleRehearsal();
</script>
</body>
</html>

name: 숏폼레이더 일일 트렌드 배치 업데이트

on:
  schedule:
    # 매일 아침 07:15 KST (UTC 22:15) — 하루 1회 30일·7일·1일 전체 갱신
    - cron: '15 22 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '수집 기간 (all / 30 / 7 / 1)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - '30'
          - '7'
          - '1'
      paths:
        description: '테스트용 특정 경로 (비우면 전체 13개, 예: beauty,beauty/skincare/toner)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 수집 기간 결정
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "days=${{ github.event.inputs.days }}" >> $GITHUB_OUTPUT
          else
            echo "days=all" >> $GITHUB_OUTPUT
          fi

      - name: 1단계 트렌드 스냅샷 갱신
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python batch_update.py --days "${{ steps.cfg.outputs.days }}" --paths "${{ github.event.inputs.paths || '' }}"
          python batch_update.py --verify

      - name: 변경된 스냅샷 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trends_snapshot.json data/trends_snapshot.js beauty_channels.json
          if git diff --staged --quiet; then
            echo "변경된 스냅샷이 없습니다."
          else
            git commit -m "chore(batch): update ShortformRadar trends snapshot (${{ steps.cfg.outputs.days }}d)"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
